[package]
name = "portfolio-wasm"
version = "0.1.0"
edition = "2021"
description = "Portfolio website — Rust SSG + WASM client interactivity"

[[bin]]
name = "portfolio-ssg"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "HtmlElement",
    "HtmlCollection",
    "NodeList",
    "DomTokenList",
    "Storage",
    "Event",
    "EventTarget",
    "MouseEvent",
    "IntersectionObserver",
    "IntersectionObserverInit",
    "IntersectionObserverEntry",
    "console",
    "CssStyleDeclaration",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
